[project]
name = "devpilot-backend"
version = "0.1.0"
description = "DevPilot API: repository ingestion, static analysis and LLM-assisted code review"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.15.0",
    "argon2-cffi>=25.1.0",
    "bandit>=1.9.4",
    "cryptography>=50.0.2",
    "fastapi>=0.143.3",
    "httpx>=0.28.1",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.0",
    "pydantic[email]>=2.14.1",
    "python-multipart>=0.0.32",
    "ruff>=0.17.1",
    "sqlalchemy>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108", "S603", "S607", "E501"]
"alembic/env.py" = ["E402"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
plugins = []

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live_llm: calls a real LLM provider (needs API key)"]
addopts = "-m 'not live_llm'"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
]
