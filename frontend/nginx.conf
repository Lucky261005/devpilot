server {
  listen 80;
  client_max_body_size 60m;

  # Clients reach nginx through the port published on the host's loopback (docker-compose.yml), so
  # every connection comes from the Docker gateway. Only from there is X-Forwarded-For believed: it
  # is set by an HTTPS reverse proxy on the host. With real_ip_recursive off, only the last address
  # (the one the host proxy added) is used, so values a client invents earlier in the list are ignored.
  set_real_ip_from 172.30.0.1;
  real_ip_header X-Forwarded-For;
  real_ip_recursive off;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://backend:8000;
    proxy_set_header Host $http_host;  # keep the port: OAuth redirect URIs are built from it
    proxy_set_header X-Request-ID $request_id;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 300s;
  }

  location / {
    # /login is prerendered to login.html (scripts/prerender.mjs); other routes are SPA.
    try_files $uri $uri.html /index.html;
    # Web app headers (API responses carry their own, set by the backend). The build has no inline
    # scripts or <style> blocks; the prerendered page has inline style attributes, hence
    # style-src-attr. HSTS belongs on the TLS terminator in front of nginx, which is not part of
    # this container.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; style-src-attr 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
  }
}
